<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloma · Token 用量监测</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="/" aria-label="Bloma Token Monitor 首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Bloma <span class="brand-divider"></span><span class="brand-tool">Token Monitor</span></a>
      <span class="live" id="live" role="status">正在连接</span>
    </div>
  </header>
  <main class="shell">
    <div class="page-heading">
      <div><h1>Token 用量监测</h1><p>追踪项目的模型调用、缓存用量和 API 估算费用。</p></div>
      <button id="prices-open" class="button secondary" type="button">模型价格 <span aria-hidden="true">↗</span></button>
    </div>
    <form id="filters" class="panel filters">
      <label class="project">项目 <select id="project"><option value="">全部项目</option></select></label>
      <label>开始时间 <input id="start" type="datetime-local"></label>
      <label>结束时间 <input id="end" type="datetime-local"></label>
      <button class="button primary" type="submit">查询用量</button>
      <button class="button plain" id="clear-filters" type="button">清除筛选</button>
    </form>
    <p id="notice" class="notice" role="status" hidden></p>
    <section class="metrics" aria-label="用量总览">
      <article class="panel metric"><span>总 Token</span><strong id="total">—</strong><small id="calls">模型请求</small></article>
      <article class="panel metric"><span>输入 Token</span><strong id="input">—</strong><small id="input-sub">含缓存读写</small></article>
      <article class="panel metric"><span>输出 Token</span><strong id="output">—</strong><small>供应商上报输出</small></article>
      <article class="panel metric"><span>API 估算费用</span><strong id="cost">—</strong><small id="cost-sub">美元 · 公开文本费率</small></article>
    </section>
    <section class="panel analysis" aria-labelledby="analysis-title">
      <div class="section-heading">
        <div><h2 id="analysis-title">用量分析</h2><p id="chart-caption">按请求开始时间统计已上报的 Token</p></div>
        <fieldset class="switcher" aria-label="图表分类方式">
          <label><input type="radio" name="view" value="time" checked><span>用量趋势</span></label>
          <label><input type="radio" name="view" value="phase"><span>工作流阶段</span></label>
          <label><input type="radio" name="view" value="model"><span>供应商 / 模型</span></label>
        </fieldset>
      </div>
      <fieldset class="legend" id="legend" aria-label="显示的 Token 类别">
        <label><input type="checkbox" value="uncached" checked><span class="swatch uncached"></span>非缓存输入</label>
        <label><input type="checkbox" value="read" checked><span class="swatch read"></span>缓存读取</label>
        <label><input type="checkbox" value="write" checked><span class="swatch write"></span>缓存写入</label>
        <label><input type="checkbox" value="output" checked><span class="swatch output"></span>输出</label>
      </fieldset>
      <div class="chart" id="chart"></div>
    </section>
    <section class="panel conversation" aria-labelledby="turns-title">
      <div class="section-heading">
        <div><h2 id="turns-title">逐轮对话</h2><p id="turn-count">查看本地摘要和每次模型调用</p></div>
        <label class="search"><span class="sr-only">搜索对话</span><input id="search" type="search" placeholder="搜索摘要、模型或供应商"></label>
      </div>
      <div class="table-head" aria-hidden="true"><span>对话摘要</span><span>阶段 / 模型</span><span>Token</span><span></span></div>
      <div id="turns"></div>
      <div class="pagination" id="pagination" hidden>
        <button class="button secondary" id="previous" type="button">上一页</button><span id="page-label"></span><button class="button secondary" id="next" type="button">下一页</button>
      </div>
    </section>
    <footer>数据来自 Bloma 本机请求账本 · 时间采用浏览器时区</footer>
  </main>
  <dialog id="prices" aria-labelledby="prices-title">
    <div class="dialog-head"><div><h2 id="prices-title">模型价格</h2><p>美元 / 100 万文本 Token · 标准费率，适用时显示区间</p></div><button class="button plain" id="prices-close" type="button" aria-label="关闭价格表">关闭</button></div>
    <div class="price-toolbar"><button id="refresh-prices" class="button primary" type="button">从官网刷新</button><label><input id="all-models" type="checkbox">显示全部已知模型</label><span id="price-update" role="status"></span></div>
    <div id="price-sources" class="price-sources"></div>
    <div class="wide-table" id="price-table"></div>
  </dialog>
</body>
</html>
