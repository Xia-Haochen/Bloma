const pop=document.createElement('section');pop.className='comic-popover';pop.id='bloma-stage-comic';pop.hidden=true;pop.setAttribute('role','region');pop.setAttribute('aria-label','阶段漫画与进展');

buttons.forEach((button,i)=>{

});
pop.addEventListener('pointerenter',()=>clearTimeout(hideTimer));pop.addEventListener('pointerleave',scheduleHide);pop.addEventListener('focusout',scheduleHide);

})();

@media(max-width:850px){#bloma-atelier .masthead{gap:16px;margin:7px 9px 8px;padding:0 14px;}#bloma-atelier .glass-dock{gap:0;padding:3px 4px;}#bloma-atelier .glass-dock .zoom-tools button{padding:4px 5px;font-size:9px;}#bloma-atelier .glass-dock .tool{padding:5px;}#bloma-atelier .canvas-caption{gap:5px;}#bloma-atelier .canvas-caption>.tool{font-size:9px;}}
@media(max-width:650px){#bloma-atelier .masthead{height:103px;min-height:103px;margin:7px 8px;padding:10px 13px 8px;gap:0;border-radius:11px;flex-wrap:wrap;}#bloma-atelier .phase-nav{flex-basis:100%;order:3;max-width:none;margin-top:8px;gap:8px;}#bloma-atelier .phase-nav .phase{font-size:11px;}#bloma-atelier .mobile-tabs{background:#f4f6ef;border:0;padding:4px 0 8px;}#bloma-atelier .canvas-caption{min-height:69px;gap:6px;align-content:center;justify-content:space-between;}#bloma-atelier .canvas-caption .status-summary{flex-basis:100%;}#bloma-atelier .glass-dock{margin-left:0;padding:4px;gap:1px;}#bloma-atelier .glass-dock .zoom-tools button{font-size:10px;padding:4px 5px;}#bloma-atelier .glass-dock .tool{padding:5px;}#bloma-atelier .glass-dock .glass-divider{margin:0 2px;}#bloma-atelier .canvas-caption>.tool{margin-left:0;font-size:10px;}#bloma-atelier .comic-popover{max-width:calc(100% - 24px);}}
@media(max-width:360px){#bloma-atelier .masthead{padding-left:11px;padding-right:11px;}#bloma-atelier .phase-nav{gap:6px;}#bloma-atelier .phase-nav .phase{font-size:10px;}#bloma-atelier .glass-dock .zoom-tools button{font-size:9px;padding:4px;}#bloma-atelier .glass-dock .tool{padding:5px 4px;}#bloma-atelier .glass-dock .tool svg{width:13px;height:13px;}#bloma-atelier .glass-dock .glass-divider{margin:0 1px;}#bloma-atelier .canvas-caption>.tool{font-size:9px;gap:2px;}}

<script>
(()=>{
const root=document.getElementById('bloma-atelier');
const caption=root.querySelector('.canvas-caption');
const zoom=root.querySelector('.zoom-tools');
const tools=root.querySelector('.project-heading .view-tabs');
const dock=document.createElement('div');dock.className='glass-dock';dock.setAttribute('role','toolbar');dock.setAttribute('aria-label','预览工具');
caption.insertBefore(dock,zoom);dock.append(zoom);
const divider=document.createElement('span');divider.className='glass-divider';divider.setAttribute('aria-hidden','true');dock.append(divider);
tools.querySelectorAll('button').forEach(button=>dock.append(button));tools.remove();
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
root.querySelectorAll('.masthead,.glass-dock,.comic-popover').forEach(surface=>{
surface.addEventListener('pointermove',event=>{if(reduceMotion.matches||root.classList.contains('solid-material'))return;const box=surface.getBoundingClientRect();surface.style.setProperty('--glass-x',(event.clientX-box.left)+'px');surface.style.setProperty('--glass-y',(event.clientY-box.top)+'px');});
});
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();

</script>
<style>
#bloma-atelier .overlay{background:#24331e1a;}
#bloma-atelier .sheet,#bloma-atelier .comic-popover{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;isolation:isolate;overflow:hidden;border:1px solid #ffffffe6;box-shadow:0 15px 45px #26391b2e,inset 0 1px 0 #ffffffd9;}
#bloma-atelier .sheet{position:relative;margin:13px calc(var(--conversation) + 13px) 13px 13px;height:calc(100% - 26px);width:min(460px,calc(100% - var(--conversation) - 26px));border-radius:13px;padding:20px;}
#bloma-atelier .refractive-panel-material{position:absolute!important;inset:0;z-index:-1!important;pointer-events:none;}
#bloma-atelier .refractive-panel-material>.glass-surface{height:100%;width:100%;}
#bloma-atelier .sheet-head{background:#ffffffe0;border-radius:8px;padding:10px 12px;margin-bottom:13px;gap:10px;}
#bloma-atelier .sheet-content{background:#fffefaf0;border:1px solid #ffffffc4;border-radius:9px;padding:17px;}
#bloma-atelier .sheet-head h3{font-size:18px;color:#425638;}
#bloma-atelier .sheet-content p{color:#76856a;}
#bloma-atelier .sheet-content .detail-row{color:#536948;}
#bloma-atelier .comic-popover::before{display:none;}
#bloma-atelier .comic-popover .comic-head{background:#ffffffd4;margin:7px 7px 6px;border-radius:7px;padding:8px 10px;}
#bloma-atelier .comic-caption{margin:7px 10px 0;padding:9px 10px 4px;background:#ffffffd9;border-radius:6px 6px 0 0;color:#5f7451;}
#bloma-atelier .comic-foot{margin:0 10px 10px;padding:5px 9px 8px;background:#ffffffd9;border-radius:0 0 6px 6px;color:#89967c;}
#bloma-atelier .solid-material .refractive-panel-material{display:none;}
#bloma-atelier.solid-material .refractive-panel-material{display:none;}
#bloma-atelier.solid-material .sheet,#bloma-atelier.solid-material .comic-popover{background:#fdfef8;}
#bloma-atelier .header-tools{gap:1px;}
#bloma-atelier .header-tools .tool{padding:7px 6px;}
#bloma-atelier .phase-nav{max-width:490px;}
@media(max-width:850px){#bloma-atelier .header-tools .tool span{display:none;}#bloma-atelier .masthead{gap:15px;}}
@media(max-width:650px){#bloma-atelier .sheet{margin:10px;width:calc(100% - 20px);height:calc(100% - 20px);padding:12px;}#bloma-atelier .sheet-content{padding:13px;}#bloma-atelier .sheet-head{padding:8px 9px;}#bloma-atelier .phase-nav{max-width:none;}#bloma-atelier .masthead{gap:0;}}

</style>
